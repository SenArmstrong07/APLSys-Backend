[build]
builder = "NIXPACKS"

[deploy]
startCommand = "uvicorn main:app --host 0.0.0.0 --port $PORT"

[nixpacks]
plan = "python"
aptPkgs = ["libgl1", "libglib2.0-0", "libjpeg-dev", "zlib1g", "ghostscript", "libxml2", "libxslt1.1", "openjdk-11-jre"]

[packages]
apt = [
  "libgl1",
  "libglib2.0-0",
  "libsm6",
  "libxext6",
  "libxrender1",
  "libjpeg-dev",
  "zlib1g",
  "ghostscript",
  "libxml2",
  "libxslt1.1",
  "openjdk-11-jre"
]
